<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Page</title>
    <link rel="stylesheet" href="./bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="container">
    <h1>Create Account</h1>

    <h2>form</h2>
    <form action="/signup" method="post">
        <div class="form-group">
            <label for="firstname">First Name</label>
            <input type="text" name="firstname" placeholder="Enter your firstname" class="form-control">
        </div>
        <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" name="surname" placeholder="Enter your Surname" class="form-control">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" placeholder="Enter your Email" class="form-control">
        </div>
        <select name="department" class="form-control">
            <option value="" selected disabled>Select Department</option>
            <option value="CSC">Computer Science</option>
            <option value="CME">Computer Engineering</option>
            <option value="CSE">Computer Science Education</option>
        </select>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Enter your Password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <script src="./bootstrap/dist/js/bootstrap.min.js"></script>
    <script>
        // new FormData()
    </script>
</body>
</html>
