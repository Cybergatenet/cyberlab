<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | welcome</title>
    <!-- Jwt decoder -->
    <script src="https://cloudflare.com"></script>

<body class="container">
    <div class="row p-3">
        <h1 class="col-md-8">Welcome to Dashboard</h1>
        <button class="btn btn-sm btn-primary col-md-4" data-bs-toggle="modal" data-bs-target="#addModal">Add Product</button>
    </div>

    <table class="table table-bordered">
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        <!-- List of Products -->
        <tbody id="product">

        </tbody>
    </table>

    <!-- Modal box here -->
    <!-- Button to Open the Modal -->
    <!-- <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
    Open modal
    </button> -->

    <!-- The Modal -->
    <div class="modal" id="myModal">
    <div class="modal-dialog">
        <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
            <h4 class="modal-title">Edit Product</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Modal body -->
        <div class="modal-body">
            <form class="form-group" id="form">
               <label for="">product Id</label>
                <input type="number" class="form-control" name="products_id" value="" id="products_id" hidden>
                 <label for="">product Name</label>
                <input type="text" class="form-control" name="product_name" id="product_name">
                 <label for="">Price</label>
                <input type="number" class="form-control" name="price" id="price">
                 <label for="">Quantity</label>
                <input type="number" class="form-control" name="quantity" id="quantity">
                
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" onclick="updateProduct()" class="btn btn-primary" >Submit</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </form>
        </div>
        </div>
    </div>
    </div>


    <!-- Modal to Add Prodcuts -->
    <div class="modal" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content">
        <!-- Modal Header -->
        <div class="modal-header">
            <h4 class="modal-title">Add New Product</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <!-- Modal body -->
        <div class="modal-body">
            <form class="form-group" id="form">
                <label for="product_name">Product Name</label>
                <input type="text" class="form-control" name="pro_name" id="pro_name" placeholder="Enter Product Name">
                <label for="price">Price</label>
                <input type="number" class="form-control" name="pro_price" id="pro_price" placeholder="Enter Product Price">
                 <label for="quantity">Quantity</label>
                <input type="number" class="form-control" name="pro_quantity" id="pro_quantity" placeholder="Enter Product Quantity">
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" onclick="addProduct()" class="btn btn-primary" >Add</button>
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </form>
        </div>
        </div>
    </div>
    </div>

    <script src="./bootstrap/dist/js/bootstrap.min.js"></script>
    <script>
        const product = document.querySelector("#product")
        // Fetch Products from API
        const editProduct = (id, product_name, price, quantity) => {
            // console.log(id, product_name, price, quantity);
            const pro_id = document.querySelector("#products_id"),
                name = document.querySelector("#product_name"),
                pro_price = document.querySelector("#price"),
                Pro_quantity = document.querySelector("#quantity"),
                form = document.querySelector("#form");

            pro_id.value = id;
            name.value = product_name;
            pro_price.value = price;
            Pro_quantity.value = quantity;
        }

        // updateProduct
        const updateProduct = (e) => {
            // e.preventDefault();
            const pro_id = document.querySelector("#products_id"),
                pro_name = document.querySelector("#product_name"),
                pro_price = document.querySelector("#price"),
                Pro_quantity = document.querySelector("#quantity");

            fetch("http://localhost:5000/update/"+pro_id.value, {
                method: 'PATCH',
                headers: {
                    'content-type': 'application/json',
                },
                body: {pro_name, pro_price, Pro_quantity}
                // body: new FormData(form)
            })
            .then(res => res.json())
            .then(data => console.log(data))
            .catch(err => console.log(err.message))
        }

        const deleteProduct = (id) => {
            // alert(id)
            const answer = confirm("You are about to delete this product. Continue?")
            if(answer){
                fetch(`http://localhost:5000/delete/${id}`, {
                    method: "delete"
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.message)
                    document.location.href = "http://localhost:5000/dashboard"
                }) 
            }
        }

        // Add New Product
        const addProduct = () => {
            const pro_name = document.querySelector("#pro_name"),
                pro_price = document.querySelector("#pro_price"),
                pro_quantity = document.querySelector("#pro_quantity");

            // console.log(pro_name.value, pro_price.value, pro_quantity.value);
            if(pro_name.value != "" && pro_price.value != "" && pro_quantity.value != ""){
                // Make API call
                const token = localStorage.getItem("token");
                console.log(token)
                fetch("http://localhost:5000/addproduct", {
                    method: "POST",
                    headers: {
                        'content-type': "application/json",
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: pro_name.value, price: pro_price.value, quantity: pro_quantity.value
                    })
                })
                .then(response => response.json())
                .then(data => { 
                    alert(data.message);
                    document.location.href = "http://localhost:5000/dashboard"
                })
                .catch(error => console.log("f-Error: ", error))

            }else{
                alert("Kindly fill out all the boxes")
            }
            
            // alert("Product Added")
        }



        const products = async () => {
            const token = localStorage.getItem("token");
            await fetch("http://localhost:5000/products", {
                method: "GET",
                headers: {
                    'Content-type': "Application/json",
                    // 'Authorization': `Bearer ${token}`, // localStorage and SessionStorage
                    'credentials': 'include' // Backend Cookies
                }
            })
            .then(res => res.json())
            .then(data => {
                // console.log(data);
                if(data.error){
                    alert(data.message)
                    document.location.href = "/login"
                }
                const results = data.payload
                results.forEach(result => {
                    // console.log({...result});
                    product.innerHTML += `
                        <tr>
                            <td>${result.products_id}</td>
                            <td>${result.product_name}</td>
                            <td>${result.price}</td>
                            <td>${result.quantity}</td>
                            <td>
                                <button id="${result.products_id}" onclick="editProduct(${result.products_id}, '${result.product_name}', '${result.price}', '${result.quantity}')" class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#myModal">Edit</button>
                                <button id="${result.products_id}" onclick="deleteProduct(${result.products_id})" class="btn btn-sm btn-danger">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            })   
        }

        products();
    </script>
